<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>

<body>

    <div class="container">

        <h1>🏠 House Price Prediction</h1>

        <p>Enter the house details below.</p>
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form action="/predict" method="POST">

            <div class="form-group">
                <label>Overall Quality (1-10)</label>
                <input type="number" name="OverallQual" min="1" max="10"
                    value="{{ form_data.OverallQual if form_data else '' }}" required>
            </div>
            <div class="form-group">
                <label>Year Built</label>
                <input type="number" name="YearBuilt" value="{{ form_data.YearBuilt if form_data else '' }}" required>
            </div>
            <div class="form-group">
                <label>Living Area (sq ft)</label>
                <input type="number" name="GrLivArea" min="0" value="{{ form_data.GrLivArea if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Garage Cars</label>
                <input type="number" name="GarageCars" min="0" value="{{ form_data.GarageCars if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Total Basement Area (sq ft)</label>
                <input type="number" name="TotalBsmtSF" min="0" value="{{ form_data.TotalBsmtSF if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>1st Floor Area (sq ft)</label>
                <input type="number" name="1stFlrSF" min="0" value="{{ form_data['1stFlrSF'] if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Full Bathrooms</label>
                <input type="number" name="FullBath" min="0" value="{{ form_data.FullBath if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Bedrooms</label>
                <input type="number" name="BedroomAbvGr" min="0"
                    value="{{ form_data.BedroomAbvGr if form_data else '' }}" required>
            </div>
            <div class="form-group">
                <label>Total Rooms Above Ground</label>
                <input type="number" name="TotRmsAbvGrd" min="0"
                    value="{{ form_data.TotRmsAbvGrd if form_data else '' }}" required>
            </div>
            <div class="form-group">
                <label>Garage Area (sq ft)</label>
                <input type="number" name="GarageArea" min="0" value="{{ form_data.GarageArea if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>2nd Floor Area (sq ft)</label>
                <input type="number" name="2ndFlrSF" min="0" value="{{ form_data['2ndFlrSF'] if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Year Remodeled</label>
                <input type="number" name="YearRemodAdd" value="{{ form_data.YearRemodAdd if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Fireplaces</label>
                <input type="number" name="Fireplaces" min="0" value="{{ form_data.Fireplaces if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Wood Deck Area (sq ft)</label>
                <input type="number" name="WoodDeckSF" min="0" value="{{ form_data.WoodDeckSF if form_data else '' }}"
                    required>
            </div>
            <div class="form-group">
                <label>Open Porch Area (sq ft)</label>
                <input type="number" name="OpenPorchSF" min="0" value="{{ form_data.OpenPorchSF if form_data else '' }}"
                    required>
            </div>

            <div class="button-group">

                <button type="submit">
                    Predict Price
                </button>

                <button type="button" class="reset-btn" onclick="clearForm()">
                    Clear Form
                </button>

            </div>

        </form>


        {% if prediction %}
        <div class="result">

            <h2>Predicted House Price</h2>

            <p>${{ "{:,.2f}".format(prediction) }}</p>

        </div>
        {% endif %}

    </div>
    <script>
        function clearForm() {
            const form = document.querySelector("form");

            form.querySelectorAll("input").forEach(input => {
                input.value = "";
            });

            const result = document.querySelector(".result");

            if (result) {
                result.remove();
            }
        }
    </script>

</body>

</html>
